apiVersion: v1
kind: Pod
metadata:
  name: olelo-transcription
  namespace: gilpin-lab
spec:
  restartPolicy: Never
  containers:
    - name: transcription
      image: python:3.11-slim
      command:
        - bash
        - -c
        - |
          apt-get update &&
          apt-get install -y ffmpeg &&
          pip install --no-cache-dir faster-whisper &&
          sleep infinity
      resources:
        requests:
          cpu: "1"
          memory: "4Gi"
        limits:
          cpu: "1"
          memory: "4Gi"
      volumeMounts:
        - name: ami-data
          mountPath: /data
  volumes:
    - name: ami-data
      persistentVolumeClaim:
        claimName: pkandhas-ami-data
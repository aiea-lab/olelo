apiVersion: v1
kind: Pod
metadata:
  name: ami-inspect
  namespace: gilpin-lab
spec:
  restartPolicy: Never
  containers:
    - name: inspector
      image: ubuntu:24.04
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
      volumeMounts:
        - name: ami-data
          mountPath: /data
  volumes:
    - name: ami-data
      persistentVolumeClaim:
        claimName: pkandhas-ami-data
